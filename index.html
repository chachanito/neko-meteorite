<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050624">
    <title>Neko bajo la Vía Láctea</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; margin: 0; }
        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #02020d;
        }
        .scene {
            position: relative;
            height: 100svh;
            max-width: 100vw;
            aspect-ratio: 864 / 1242;
            overflow: hidden;
            isolation: isolate;
            background: #070828;
            box-shadow: 0 0 80px #35187566;
        }
        .background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            transform: scale(1.025);
            transition: opacity 900ms ease, transform 4s ease;
        }
        .background.is-active {
            opacity: 1;
            animation: scene-breathe 8s ease-in-out infinite alternate;
        }
        #effects {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }
        .tail {
            position: absolute;
            z-index: 3;
            left: 47.1%;
            top: 66.15%;
            width: 3.3%;
            height: 3.5%;
            transform-origin: 80% 82%;
            animation: wag 1.65s ease-in-out infinite alternate;
            filter: drop-shadow(-1px 1px 0 #171323) drop-shadow(1px 0 0 #171323);
            transition: opacity 500ms ease;
        }
        .tail::before {
            content: '';
            position: absolute;
            inset: 0;
            border: clamp(2px, .42vw, 5px) solid #b8b7ca;
            border-right-color: transparent;
            border-top-color: transparent;
            border-radius: 50%;
            transform: rotate(-25deg);
            box-shadow: inset 2px -1px 0 #83879f;
        }
        .tail::after {
            content: '';
            position: absolute;
            left: 2%;
            top: 9%;
            width: 31%;
            aspect-ratio: 1;
            border-radius: 2px;
            background: #d1ceda;
        }
        .glow {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background:
                radial-gradient(circle at 48% 40%, #aa71ff12 0 18%, transparent 42%),
                linear-gradient(180deg, transparent 68%, #03041222 100%);
            mix-blend-mode: screen;
        }
        .scarf-tip {
            position: absolute;
            z-index: 3;
            left: 55.2%;
            top: 69.2%;
            width: 9.5%;
            height: 1.65%;
            border-radius: 20% 75% 45% 20%;
            background: linear-gradient(180deg, #17678b, #08405f);
            clip-path: polygon(0 10%, 100% 0, 86% 100%, 0 75%);
            transform-origin: left center;
            opacity: 0;
            animation: scarf-wave 2.2s ease-in-out infinite alternate;
            filter: drop-shadow(0 1px 1px #020817);
            transition: opacity 500ms ease;
        }
        .wind-grass {
            position: absolute;
            z-index: 3;
            left: -4%;
            right: -4%;
            bottom: -1%;
            height: 18%;
            opacity: 0;
            transform-origin: bottom center;
            background: repeating-linear-gradient(77deg, transparent 0 13px, #486291 14px 15px, transparent 16px 25px);
            clip-path: polygon(0 72%, 3% 55%, 5% 75%, 8% 43%, 10% 74%, 14% 52%, 17% 76%, 21% 38%, 24% 76%, 29% 49%, 33% 77%, 38% 40%, 41% 76%, 47% 48%, 52% 77%, 57% 42%, 61% 76%, 67% 51%, 72% 77%, 78% 39%, 82% 76%, 88% 50%, 92% 76%, 96% 43%, 100% 70%, 100% 100%, 0 100%);
            mix-blend-mode: screen;
            animation: grass-wind 2.8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .scene[data-scene="1"] .wind-grass,
        .scene[data-scene="2"] .wind-grass,
        .scene[data-scene="3"] .wind-grass,
        .scene[data-scene="10"] .wind-grass,
        .scene[data-scene="15"] .wind-grass,
        .scene[data-scene="18"] .wind-grass,
        .scene[data-scene="20"] .wind-grass,
        .scene[data-scene="21"] .wind-grass { opacity: .18; }
        .persian-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 500ms ease;
        }
        .motion-copy {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            will-change: transform;
        }
        .animal-motion {
            -webkit-mask-image: radial-gradient(ellipse 18% 17% at 50% 70.5%, #000 0 58%, #000b 72%, transparent 100%);
            mask-image: radial-gradient(ellipse 18% 17% at 50% 70.5%, #000 0 58%, #000b 72%, transparent 100%);
            transform-origin: 50% 78%;
            animation: animal-alive 3.4s ease-in-out infinite alternate;
        }
        .scene:not([data-scene="21"]) .animal-motion { opacity: 1; }
        .foreground-motion {
            -webkit-mask-image: linear-gradient(to bottom, transparent 61%, #0005 69%, #000 79%);
            mask-image: linear-gradient(to bottom, transparent 61%, #0005 69%, #000 79%);
            transform-origin: center bottom;
            animation: foreground-drift 6.5s ease-in-out infinite alternate;
        }
        .scene:not([data-scene="21"]) .foreground-motion { opacity: .82; }
        .nature-left {
            -webkit-mask-image: linear-gradient(105deg, #000 0 12%, #000b 21%, transparent 39%);
            mask-image: linear-gradient(105deg, #000 0 12%, #000b 21%, transparent 39%);
            transform-origin: left 70%;
            animation: branch-sway-left 5.4s ease-in-out infinite alternate;
        }
        .nature-right {
            -webkit-mask-image: linear-gradient(255deg, #000 0 12%, #000b 21%, transparent 39%);
            mask-image: linear-gradient(255deg, #000 0 12%, #000b 21%, transparent 39%);
            transform-origin: right 70%;
            animation: branch-sway-right 6.1s ease-in-out infinite alternate;
        }
        .scene[data-nature="true"]:not([data-scene="21"]) .nature-left,
        .scene[data-nature="true"]:not([data-scene="21"]) .nature-right { opacity: .9; }
        .water-motion {
            position: absolute;
            z-index: 3;
            left: 0;
            right: 0;
            top: 54%;
            height: 28%;
            opacity: 0;
            pointer-events: none;
            background:
                repeating-radial-gradient(ellipse at 50% 25%, transparent 0 14px, #d6e7ff48 15px 16px, transparent 17px 28px),
                linear-gradient(100deg, transparent 12%, #b9d8ff28 50%, transparent 82%);
            mask-image: linear-gradient(transparent, #000 22%, #000 75%, transparent);
            mix-blend-mode: screen;
            animation: lake-current 5.5s linear infinite;
        }
        .scene[data-water="true"]:not([data-scene="21"]) .water-motion { opacity: .28; }
        .scene[data-scene="21"] .persian-layer { opacity: 1; }
        .persian-character {
            background: url('assets/21-persian-cat-lake.png') center / cover no-repeat;
            clip-path: ellipse(16% 16% at 50% 72%);
            transform-origin: 50% 78%;
            animation: persian-breathe 3.6s ease-in-out infinite alternate;
        }
        .persian-tree-left,
        .persian-tree-right {
            background: url('assets/21-persian-cat-lake.png') center / cover no-repeat;
            transform-origin: 50% 72%;
            animation: tree-breeze 5.2s ease-in-out infinite alternate;
        }
        .persian-tree-left { clip-path: polygon(0 0, 39% 0, 36% 61%, 18% 67%, 0 72%); }
        .persian-tree-right {
            clip-path: polygon(65% 0, 100% 0, 100% 72%, 88% 64%, 74% 58%);
            animation-direction: alternate-reverse;
        }
        .water-ripples {
            top: 55%;
            bottom: 21%;
            height: auto;
            background:
                repeating-radial-gradient(ellipse at 50% 35%, transparent 0 12px, #b8d8ff45 13px 14px, transparent 15px 25px);
            mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent);
            mix-blend-mode: screen;
            animation: none;
        }
        .scene[data-scene="21"] .water-ripples { animation: water-flow 4.5s linear infinite; }
        .tail { opacity: 0; }
        .scene[data-scene="1"] .tail { opacity: 1; }
        .scene[data-scene="2"] .scarf-tip { opacity: .92; }
        .scene-info {
            position: absolute;
            z-index: 6;
            left: 50%;
            bottom: 3.2%;
            transform: translateX(-50%);
            min-width: max-content;
            padding: 7px 12px;
            border: 1px solid #d7ccff38;
            border-radius: 999px;
            color: #f0edff;
            background: #05051b85;
            backdrop-filter: blur(8px);
            font: 600 clamp(10px, 1.2vw, 13px)/1.1 system-ui, sans-serif;
            letter-spacing: .05em;
            text-shadow: 0 1px 3px #000;
        }
        .nav {
            position: absolute;
            z-index: 7;
            inset: 50% 0 auto;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .nav button {
            width: 36px;
            height: 36px;
            border: 1px solid #fff4;
            border-radius: 50%;
            color: white;
            background: #05051c72;
            backdrop-filter: blur(6px);
            cursor: pointer;
            pointer-events: auto;
            font: 24px/1 system-ui, sans-serif;
            transition: background 180ms ease, transform 180ms ease;
        }
        .nav button:hover,
        .nav button:focus-visible {
            background: #6a45aeaa;
            transform: scale(1.08);
            outline: 2px solid #d9c8ff;
            outline-offset: 2px;
        }
        @keyframes wag {
            0% { transform: rotate(-13deg) translate(-1px, 0); }
            50% { transform: rotate(1deg) translate(0, -1px); }
            100% { transform: rotate(18deg) translate(2px, 0); }
        }
        @keyframes scarf-wave {
            from { transform: rotate(-7deg) skewX(-5deg); }
            to { transform: rotate(9deg) skewX(7deg) translateY(2px); }
        }
        @keyframes scene-breathe {
            from { transform: scale(1); }
            to { transform: scale(1.012) translateY(-1px); }
        }
        @keyframes grass-wind {
            from { transform: skewX(-2deg) translateX(-2px); }
            to { transform: skewX(3deg) translateX(3px); }
        }
        @keyframes persian-breathe {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-1px) scale(1.006, 1.012); }
        }
        @keyframes tree-breeze {
            from { transform: skewX(-.35deg) rotate(-.08deg); }
            to { transform: skewX(.45deg) rotate(.1deg); }
        }
        @keyframes water-flow {
            from { transform: translateY(0) scaleX(1); opacity: .18; }
            50% { opacity: .3; }
            to { transform: translateY(8px) scaleX(1.025); opacity: .18; }
        }
        @keyframes animal-alive {
            from { transform: translateY(0) scale(1); }
            55% { transform: translateY(-1px) scale(1.004, 1.01); }
            to { transform: translateY(0) rotate(.12deg) scale(1.002); }
        }
        @keyframes foreground-drift {
            from { transform: translateX(-1px) scale(1.002); }
            to { transform: translateX(2px) scale(1.008); }
        }
        @keyframes branch-sway-left {
            from { transform: skewX(-.2deg) rotate(-.05deg); }
            to { transform: skewX(.65deg) rotate(.12deg); }
        }
        @keyframes branch-sway-right {
            from { transform: skewX(.2deg) rotate(.05deg); }
            to { transform: skewX(-.6deg) rotate(-.1deg); }
        }
        @keyframes lake-current {
            from { transform: translate(-5px, 0) scaleX(.98); filter: brightness(.9); }
            50% { filter: brightness(1.2); }
            to { transform: translate(7px, 7px) scaleX(1.025); filter: brightness(.95); }
        }
        @media (max-aspect-ratio: 864 / 1242) {
            .scene { width: 100vw; height: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            .tail, .scarf-tip, .wind-grass, .persian-layer,
            .motion-copy, .water-motion { animation: none; }
            .background { transition: none; animation: none; }
        }
    </style>
  <style id="pixel-world-styles">
    /* Smooth original artwork with isolated natural-motion layers. */
    .background {
      image-rendering: auto !important;
    }

    .background.is-active {
      animation: cinematic-camera 20s ease-in-out infinite alternate !important;
    }

    .water-motion,
    .water-ripples,
    .wind-grass,
    #pixel-nature {
      display: none !important;
    }

    .animal-motion,
    .persian-character,
    .foreground-motion,
    .nature-left,
    .nature-right,
    .persian-tree-left,
    .persian-tree-right {
      image-rendering: auto !important;
    }

    .animal-motion,
    .persian-character {
      animation: animal-presence 4.2s ease-in-out infinite !important;
      transform-origin: 50% 88% !important;
      will-change: transform;
    }

    .animal-motion {
      -webkit-mask-image: radial-gradient(ellipse 13% 14% at 50% 70.5%, #000 0 48%, #000d 62%, #0006 76%, transparent 100%) !important;
      mask-image: radial-gradient(ellipse 13% 14% at 50% 70.5%, #000 0 48%, #000d 62%, #0006 76%, transparent 100%) !important;
    }

    .scene[data-scene="1"] .animal-motion {
      -webkit-mask-image: radial-gradient(ellipse 7% 9% at 50% 69%, #000 0 52%, #000c 68%, transparent 100%) !important;
      mask-image: radial-gradient(ellipse 7% 9% at 50% 69%, #000 0 52%, #000c 68%, transparent 100%) !important;
    }

    .foreground-motion {
      animation: vegetation-light 5.2s ease-in-out infinite alternate !important;
      transform-origin: 50% 100% !important;
    }

    .scene:not([data-scene="21"]) .foreground-motion {
      opacity: .18 !important;
    }

    .nature-left,
    .persian-tree-left {
      animation: foliage-light 6.4s ease-in-out infinite alternate !important;
      transform-origin: 0 78% !important;
    }

    .nature-right,
    .persian-tree-right {
      animation: foliage-light 7s ease-in-out infinite alternate-reverse !important;
      transform-origin: 100% 78% !important;
    }

    .scene[data-nature="true"]:not([data-scene="21"]) .nature-left,
    .scene[data-nature="true"]:not([data-scene="21"]) .nature-right {
      opacity: .2 !important;
    }

    .scene[data-scene="21"] .persian-tree-left,
    .scene[data-scene="21"] .persian-tree-right {
      opacity: .2 !important;
    }

    .persian-layer,
    .nature-left,
    .nature-right {
      visibility: hidden;
    }

    .scene[data-scene="21"] .persian-layer,
    .scene[data-nature="true"]:not([data-scene="21"]) .nature-left,
    .scene[data-nature="true"]:not([data-scene="21"]) .nature-right {
      visibility: visible;
    }

    @keyframes cinematic-camera {
      from { transform: scale(1.025) translate3d(0, 0, 0); }
      to   { transform: scale(1.032) translate3d(0, -1px, 0); }
    }

    @keyframes animal-presence {
      0%, 100% { transform: none; opacity: .82; filter: brightness(1); }
      50%      { transform: none; opacity: 1; filter: brightness(1.045) saturate(1.025); }
    }

    @keyframes vegetation-light {
      from { transform: none; filter: brightness(.94) saturate(.96); opacity: .1; }
      to   { transform: none; filter: brightness(1.1) saturate(1.08); opacity: .24; }
    }

    @keyframes foliage-light {
      from { transform: none; filter: brightness(.96) saturate(.98); opacity: .1; }
      to   { transform: none; filter: brightness(1.07) saturate(1.06); opacity: .22; }
    }

    .cinematic-light,
    .horizon-mist {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cinematic-light {
      z-index: 3;
      background:
        radial-gradient(circle at 46% 36%, #b77cff18 0 12%, transparent 38%),
        radial-gradient(circle at 70% 63%, #84b7ff0d 0 10%, transparent 34%);
      background-size: 130% 130%;
      animation: light-drift 12s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    .horizon-mist {
      z-index: 3;
      top: 49%;
      bottom: auto;
      height: 22%;
      opacity: .2;
      background: linear-gradient(90deg, transparent 0%, #b8c9ff15 32%, #eddcff28 50%, #a7c4ff12 68%, transparent 100%);
      filter: blur(8px);
      animation: mist-drift 14s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    #effects {
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 2px #b9c7ff66);
    }

    .scene[data-effect="petals"] .cinematic-light {
      background: radial-gradient(circle at 35% 38%, #ff8fc424 0 10%, transparent 38%), radial-gradient(circle at 74% 64%, #ffbfd518 0 12%, transparent 36%);
    }
    .scene[data-effect="fireflies"] .cinematic-light,
    .scene[data-effect="lanterns"] .cinematic-light {
      background: radial-gradient(circle at 38% 62%, #ffd95c24 0 8%, transparent 32%), radial-gradient(circle at 70% 48%, #ffb53c18 0 10%, transparent 35%);
    }
    .scene[data-effect="aurora"] .cinematic-light,
    .scene[data-effect="snow"] .cinematic-light {
      background: radial-gradient(ellipse at 48% 24%, #62f5e51f 0 16%, transparent 48%), radial-gradient(circle at 68% 62%, #9acaff16 0 12%, transparent 38%);
    }
    .scene[data-effect="rain"] .cinematic-light {
      background: radial-gradient(ellipse at 50% 52%, #6ea8ff18 0 18%, transparent 52%), linear-gradient(120deg, transparent, #9bc7ff0c, transparent);
    }
    .scene[data-effect="steam"] .cinematic-light {
      background: radial-gradient(ellipse at 50% 68%, #e4d8ff24 0 12%, transparent 42%), radial-gradient(circle at 66% 34%, #a8c8ff10, transparent 36%);
    }
    .scene[data-effect="sand"] .cinematic-light {
      background: radial-gradient(circle at 52% 58%, #ffbe6a22 0 15%, transparent 46%), linear-gradient(105deg, transparent, #ffd28d10, transparent);
    }
    .scene[data-effect="bubbles"] .cinematic-light {
      background: radial-gradient(circle at 48% 56%, #59f1ff20 0 13%, transparent 44%), radial-gradient(circle at 72% 28%, #6da8ff14, transparent 34%);
    }
    .scene[data-effect="spores"] .cinematic-light,
    .scene[data-effect="leaves"] .cinematic-light {
      background: radial-gradient(circle at 42% 60%, #72e7a31d 0 14%, transparent 42%), radial-gradient(circle at 72% 34%, #b8e68612, transparent 35%);
    }
    .scene[data-effect="persian"] .cinematic-light {
      background: radial-gradient(circle at 78% 18%, #d7dcff24 0 9%, transparent 34%), radial-gradient(ellipse at 52% 64%, #8ccfff12 0 16%, transparent 46%);
    }

    @keyframes light-drift {
      from { background-position: 0% 0%; opacity: .6; }
      to { background-position: 18% 10%; opacity: 1; }
    }

    @keyframes mist-drift {
      from { transform: translate3d(-3%, 0, 0) scaleX(1.05); opacity: .12; }
      to { transform: translate3d(3%, -2px, 0) scaleX(1.12); opacity: .24; }
    }

    #pixel-nature {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .scene-info,
    .nav,
    button {
      z-index: 30;
    }

    .scene-info {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .animal-motion,
      .persian-character { animation: none !important; }
      .cinematic-light,
      .horizon-mist { animation: none !important; }
      #pixel-nature { display: none; }
    }
  </style>
</head>
<body>
<main class="scene" data-scene="1" aria-label="Colección de paisajes nocturnos animados">

    <span class="motion-copy foreground-motion" aria-hidden="true"></span>
    <span class="motion-copy nature-left" aria-hidden="true"></span>
    <span class="motion-copy nature-right" aria-hidden="true"></span>
    <span class="motion-copy animal-motion" aria-hidden="true"></span>
    <span class="water-motion" aria-hidden="true"></span>
    <canvas id="effects" width="432" height="621" aria-hidden="true"></canvas>
    <span class="persian-layer persian-tree-left" aria-hidden="true"></span>
    <span class="persian-layer persian-tree-right" aria-hidden="true"></span>
    <span class="persian-layer water-ripples" aria-hidden="true"></span>
    <span class="persian-layer persian-character" aria-hidden="true"></span>
    <span class="tail" aria-hidden="true"></span>
    <span class="scarf-tip" aria-hidden="true"></span>
    <span class="wind-grass" aria-hidden="true"></span>
    <span class="cinematic-light" aria-hidden="true"></span>
    <span class="horizon-mist" aria-hidden="true"></span>
    <div class="glow" aria-hidden="true"></div>
    <nav class="nav" aria-label="Cambiar escenario">
        <button type="button" class="previous" aria-label="Escena anterior">‹</button>
        <button type="button" class="next" aria-label="Escena siguiente">›</button>
    </nav>
    <div class="scene-info" aria-live="polite">01 · Neko cósmico</div>
</main>

<script>
(() => {
    'use strict';

    const canvas = document.querySelector('#effects');
    const ctx = canvas.getContext('2d');
    const scene = document.querySelector('.scene');
    const backgrounds = [...document.querySelectorAll('.background')];
    const sceneInfo = document.querySelector('.scene-info');
    const sceneNames = [
        '01 · Neko cósmico', '02 · Zorro meteorito', '03 · Conejo lunar',
        '04 · Panda luciérnaga', '05 · Búho aurora', '06 · Mapache neón',
        '07 · Ciervo sakura', '08 · Pingüino polar', '09 · Capibara termal',
        '10 · Corgi girasol', '11 · Panda rojo faroles', '12 · Koala luna azul',
        '13 · Elefante planetario', '14 · Nutria bioluminiscente',
        '15 · Erizo encantado', '16 · Oso polar', '17 · Rana de loto',
        '18 · Lobo de tormenta', '19 · Gato astronauta', '20 · Pato de terrazas',
        '21 · Gato persa del lago'
    ];
    const sceneEffects = [
        'stars', 'meteors', 'petals', 'fireflies', 'aurora', 'rain',
        'petals', 'snow', 'steam', 'fireflies', 'lanterns', 'leaves',
        'sand', 'bubbles', 'spores', 'snow', 'petals', 'rain', 'comets', 'fireflies',
        'persian'
    ];
    const natureScenes = new Set([1, 2, 3, 4, 7, 9, 10, 11, 12, 15, 16, 17, 18, 20, 21]);
    const waterScenes = new Set([3, 8, 9, 11, 12, 14, 17, 18, 20, 21]);
    const copiedLayers = [...document.querySelectorAll('.motion-copy')];
    let activeScene = 0;
    const W = canvas.width;
    const skyLimit = 408;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function showScene(nextIndex) {
        activeScene = (nextIndex + backgrounds.length) % backgrounds.length;
        backgrounds.forEach((image, index) => image.classList.toggle('is-active', index === activeScene));
        const sceneNumber = activeScene + 1;
        scene.dataset.scene = String(sceneNumber);
        scene.dataset.effect = sceneEffects[activeScene];
        scene.dataset.nature = String(natureScenes.has(sceneNumber));
        scene.dataset.water = String(waterScenes.has(sceneNumber));
        const activeImage = backgrounds[activeScene];
        const activeImageUrl = `url("${activeImage.currentSrc || activeImage.src}")`;
        copiedLayers.forEach(layer => { layer.style.backgroundImage = activeImageUrl; });
        sceneInfo.textContent = sceneNames[activeScene];
        const url = new URL(location.href);
        url.searchParams.set('scene', String(activeScene + 1));
        history.replaceState(null, '', url);
    }

    document.querySelector('.previous').addEventListener('click', () => showScene(activeScene - 1));
    document.querySelector('.next').addEventListener('click', () => showScene(activeScene + 1));
    addEventListener('keydown', event => {
        if (event.key === 'ArrowLeft') showScene(activeScene - 1);
        if (event.key === 'ArrowRight') showScene(activeScene + 1);
    });
    showScene(Number(new URLSearchParams(location.search).get('scene') || 1) - 1);

    let seed = 28471;
    const random = () => ((seed = seed * 16807 % 2147483647) - 1) / 2147483646;

    const ambient = Array.from({ length: 68 }, () => ({
        x: random() * W,
        y: random() * canvas.height,
        speed: .3 + random() * 1.35,
        size: .6 + random() * 2.2,
        phase: random() * Math.PI * 2
    }));

    const stars = Array.from({ length: 112 }, (_, index) => ({
        x: random() * W,
        y: random() * skyLimit,
        radius: index < 14 ? 1.25 + random() * 1.2 : .45 + random() * .75,
        phase: random() * Math.PI * 2,
        speed: .65 + random() * 2.1,
        drift: .08 + random() * .2,
        hue: random() > .62 ? '226,216,255' : '255,255,255'
    }));

    const dust = Array.from({ length: 64 }, () => ({
        x: 112 + random() * 155,
        y: random() * 385,
        phase: random() * Math.PI * 2,
        speed: .35 + random() * .7
    }));

    function drawStars(time) {
        for (const star of stars) {
            const pulse = .16 + ((Math.sin(time * star.speed + star.phase) + 1) / 2) * .74;
            const y = reduced ? star.y : (star.y + time * star.drift) % skyLimit;
            ctx.fillStyle = `rgba(${star.hue},${pulse})`;
            ctx.beginPath();
            ctx.arc(star.x, y, star.radius, 0, Math.PI * 2);
            ctx.fill();

            if (star.radius > 1.55 && pulse > .63) {
                ctx.fillStyle = `rgba(225,218,255,${(pulse - .5) * .72})`;
                ctx.fillRect(Math.round(star.x) - 4, Math.round(y), 9, 1);
                ctx.fillRect(Math.round(star.x), Math.round(y) - 4, 1, 9);
            }
        }
    }

    function drawGalaxyDust(time) {
        for (const point of dust) {
            const alpha = .08 + ((Math.sin(time * point.speed + point.phase) + 1) / 2) * .3;
            ctx.fillStyle = `rgba(221,168,255,${alpha})`;
            ctx.fillRect(Math.round(point.x), Math.round(point.y), 1, 1);
        }
    }

    function drawAmbient(time) {
        const effect = sceneEffects[activeScene];
        if (effect === 'stars' || effect === 'meteors' || effect === 'aurora' || effect === 'comets') return;

        for (const particle of ambient) {
            let x = particle.x;
            let y = (particle.y + time * particle.speed * 9) % canvas.height;
            let alpha = .18 + .42 * ((Math.sin(time * 1.3 + particle.phase) + 1) / 2);
            let color = '255,255,255';

            if (['fireflies', 'lanterns', 'bubbles', 'steam', 'spores'].includes(effect)) {
                y = canvas.height - ((particle.y + time * particle.speed * 6) % canvas.height);
            }
            if (effect === 'rain') { color = '170,210,255'; alpha *= .7; }
            if (effect === 'petals') { color = '255,175,218'; x += Math.sin(time + particle.phase) * 12; }
            if (effect === 'leaves') { color = '210,224,190'; x += Math.sin(time * .7 + particle.phase) * 17; }
            if (effect === 'sand') { color = '255,199,121'; x = (x + time * particle.speed * 8) % W; }
            if (effect === 'fireflies' || effect === 'lanterns') color = '255,205,73';
            if (effect === 'bubbles') color = '80,246,255';
            if (effect === 'spores') color = '104,220,255';
            if (effect === 'steam') { color = '225,220,255'; alpha *= .28; }

            ctx.fillStyle = `rgba(${color},${alpha})`;
            if (effect === 'rain') {
                ctx.fillRect(x, y, 1, 5 + particle.size * 2);
            } else {
                ctx.beginPath();
                ctx.arc(x, y, effect === 'lanterns' ? particle.size * 1.6 : particle.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawShootingStar(time, offset, startX, startY) {
        const duration = 1.35;
        const wait = 7.8;
        const cycle = (time + offset) % wait;
        if (cycle > duration || reduced) return;

        const p = cycle / duration;
        const fade = Math.sin(p * Math.PI);
        const x = startX + p * 145;
        const y = startY + p * 61;

        ctx.save();
        ctx.globalAlpha = fade;
        ctx.lineCap = 'round';
        const gradient = ctx.createLinearGradient(x - 62, y - 26, x, y);
        gradient.addColorStop(0, 'rgba(151,104,255,0)');
        gradient.addColorStop(.65, 'rgba(207,186,255,.55)');
        gradient.addColorStop(1, '#fff');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x - 62, y - 26);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function frame(ms) {
        const time = ms / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGalaxyDust(reduced ? 1 : time);
        drawStars(reduced ? 1 : time);
        drawAmbient(reduced ? 1 : time);
        drawShootingStar(time, 0, -45, 82);
        drawShootingStar(time, 4.4, 210, 35);
        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
})();
</script>
  <script id="pixel-world-engine">
    (() => {
      const PIXEL_WIDTH = 270;
      const scene = document.querySelector('.scene');
      const backgrounds = [...document.querySelectorAll('.background')];
      const pixelSources = new Map();
      const canvas = document.createElement('canvas');
      canvas.id = 'pixel-nature';
      canvas.setAttribute('aria-hidden', 'true');
      scene.appendChild(canvas);
      const ctx = canvas.getContext('2d', { alpha: true });
      ctx.imageSmoothingEnabled = false;

      const palettes = [
        ['#14234d','#263d73','#5267a0'], ['#25183d','#59304f','#bd6c5f'],
        ['#18274a','#324e71','#7794aa'], ['#183b37','#34705c','#7dbb7f'],
        ['#132f42','#275d69','#6ca5a0'], ['#1b223f','#4b4169','#a0739b'],
        ['#25394b','#51726c','#9bb18a'], ['#14334a','#2c7182','#7ed1cc'],
        ['#2a3e35','#4e7957','#a0bd72'], ['#3f3a24','#7d7339','#d2bd64'],
        ['#263524','#53663a','#a8a45a'], ['#162c34','#35616b','#82a49c'],
        ['#182249','#384482','#7f75bd'], ['#123a4a','#287387','#7fc2bd'],
        ['#203329','#4d6748','#9c9a63'], ['#24313b','#53616c','#a3acae'],
        ['#153d38','#2d7666','#78b985'], ['#232337','#515069','#9695a4'],
        ['#202143','#554e82','#a68bc2'], ['#30452c','#668052','#b5b66b'],
        ['#163044','#356779','#86a9a4']
      ];

      let sceneIndex = 0;
      let logicalHeight = 480;
      let lastFrame = 0;
      let reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const seeded = (n) => {
        const x = Math.sin(n * 91.731 + sceneIndex * 17.117) * 43758.5453;
        return x - Math.floor(x);
      };

      function resizePixelCanvas() {
        const bounds = scene.getBoundingClientRect();
        logicalHeight = Math.max(360, Math.round(bounds.height / Math.max(1, bounds.width) * PIXEL_WIDTH));
        canvas.width = PIXEL_WIDTH;
        canvas.height = logicalHeight;
        ctx.imageSmoothingEnabled = false;
      }

      function pixelateImage(img, index) {
        if (!img || img.dataset.pixelReady === '1') return;
        const original = img.currentSrc || img.src;
        img.dataset.pixelOriginal = original;
        const source = new Image();
        source.onload = () => {
          const small = document.createElement('canvas');
          const ratio = source.naturalHeight / source.naturalWidth;
          small.width = PIXEL_WIDTH;
          small.height = Math.max(1, Math.round(PIXEL_WIDTH * ratio));
          const sctx = small.getContext('2d');
          sctx.imageSmoothingEnabled = false;
          sctx.drawImage(source, 0, 0, small.width, small.height);
          const url = small.toDataURL('image/png');
          pixelSources.set(index, url);
          img.src = url;
          img.dataset.pixelReady = '1';
          syncAnimalLayer();
        };
        source.src = original;
      }

      function activeIndex() {
        const found = backgrounds.findIndex(img => img.classList.contains('is-active'));
        return found < 0 ? 0 : found;
      }

      function syncAnimalLayer() {
        sceneIndex = activeIndex();
        const url = pixelSources.get(sceneIndex);
        /* The Persian scene owns a separately aligned character layer. */
        document.querySelectorAll('.animal-motion, .foreground-motion, .nature-left, .nature-right').forEach(layer => {
          if (url) layer.style.backgroundImage = `url("${url}")`;
        });
      }

      function drawStar(x, y, brightness, phase) {
        const pulse = Math.sin(phase) > 0.45;
        ctx.fillStyle = brightness;
        ctx.fillRect(x, y, 1, 1);
        if (pulse) {
          ctx.fillRect(x - 1, y, 3, 1);
          ctx.fillRect(x, y - 1, 1, 3);
        }
      }

      function drawGrass(t) {
        const palette = palettes[sceneIndex % palettes.length];
        const wind = Math.sin(t * 0.00135 + sceneIndex * 0.7);
        const count = 88;
        for (let i = 0; i < count; i++) {
          const x = Math.floor(seeded(i + 3) * PIXEL_WIDTH);
          const depth = seeded(i + 201);
          const baseY = Math.floor(logicalHeight * (0.84 + depth * 0.16));
          const h = 3 + Math.floor(seeded(i + 401) * 9);
          const localWind = Math.round(wind * (1 + seeded(i + 601) * 2));
          ctx.fillStyle = palette[i % palette.length];
          for (let p = 0; p < h; p++) {
            const bend = Math.round(localWind * (p / h));
            ctx.fillRect(x + bend, baseY - p, p > h * 0.72 ? 1 : 2, 1);
          }
          if (i % 9 === 0) {
            const leafY = baseY - Math.floor(h * 0.55);
            ctx.fillRect(x + localWind + 1, leafY, 2, 1);
          }
        }
      }

      function drawSidePlants(t) {
        const palette = palettes[sceneIndex % palettes.length];
        const wind = Math.round(Math.sin(t * 0.0011 + sceneIndex) * 2);
        for (let side = 0; side < 2; side++) {
          const origin = side ? PIXEL_WIDTH - 3 : 2;
          const direction = side ? -1 : 1;
          for (let b = 0; b < 4; b++) {
            const baseY = Math.floor(logicalHeight * (0.8 + b * 0.047));
            const height = 22 + b * 7;
            ctx.fillStyle = palette[b % 2];
            for (let p = 0; p < height; p++) {
              const sway = Math.round((wind + direction * b) * (p / height));
              ctx.fillRect(origin + direction * Math.floor(p * 0.16) + sway, baseY - p, 2, 2);
              if (p > 6 && p % 7 === 0) {
                const lx = origin + direction * Math.floor(p * 0.16) + sway;
                ctx.fillStyle = palette[2];
                ctx.fillRect(lx, baseY - p, direction * 4, 2);
                ctx.fillStyle = palette[b % 2];
              }
            }
          }
        }
      }

      function render(t) {
        if (!reducedMotion && t - lastFrame >= 83) {
          lastFrame = t;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < 34; i++) {
            const x = Math.floor(seeded(i + 900) * PIXEL_WIDTH);
            const y = Math.floor(seeded(i + 1200) * logicalHeight * 0.62);
            drawStar(x, y, i % 4 ? '#dbe8ff' : '#dba8ff', t * 0.002 + i * 1.7);
          }
          drawGrass(t);
          drawSidePlants(t);
        }
        requestAnimationFrame(render);
      }

      /* Keep the full-resolution original artwork; do not rasterize it to pixels. */
      resizePixelCanvas();
      syncAnimalLayer();
      addEventListener('resize', resizePixelCanvas, { passive: true });
      matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => reducedMotion = e.matches);

      const observer = new MutationObserver(() => requestAnimationFrame(syncAnimalLayer));
      backgrounds.forEach(img => observer.observe(img, { attributes: true, attributeFilter: ['class'] }));
      /* The generated foreground was removed: only original scene layers move. */
    })();
  </script>
