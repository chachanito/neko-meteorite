<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050719">
  <title>Neko Sprite Pilot</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #03040d;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100svh * 9 / 16));
      height: min(100svh, calc(100vw * 16 / 9));
      overflow: hidden;
      isolation: isolate;
      background: #0a1030;
      box-shadow: 0 0 90px #6551c52f;
    }

    .backdrop {
      position: absolute;
      inset: -1.5%;
      width: 103%;
      height: 103%;
      object-fit: cover;
      animation: camera-drift 18s ease-in-out infinite alternate;
      user-select: none;
      pointer-events: none;
    }

    .night-light,
    .mist,
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .night-light {
      z-index: 2;
      background:
        radial-gradient(circle at 42% 28%, #b880ff1a 0 12%, transparent 40%),
        radial-gradient(ellipse at 52% 73%, #8ec8ff12 0 10%, transparent 42%);
      background-size: 135% 135%;
      mix-blend-mode: screen;
      animation: light-drift 11s ease-in-out infinite alternate;
    }

    .mist {
      z-index: 3;
      top: 55%;
      bottom: auto;
      height: 16%;
      background: linear-gradient(90deg, transparent, #b7c9ff1c 38%, #eadcff20 51%, #8fb9ee15 66%, transparent);
      filter: blur(10px);
      mix-blend-mode: screen;
      animation: mist-drift 13s ease-in-out infinite alternate;
    }

    #atmosphere {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .neko {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 13%;
      width: 30%;
      aspect-ratio: 3 / 4;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      background-image: url('assets/neko-sprite-sheet.png');
      background-repeat: no-repeat;
      background-size: 400% 200%;
      background-position: 0% 0%;
      filter: drop-shadow(0 7px 8px #0204139a) drop-shadow(0 0 9px #7d76ff35);
      will-change: background-position;
    }

    .ground-shadow {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 13.7%;
      width: 23%;
      height: 4%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #04061682;
      filter: blur(7px);
      animation: shadow-breathe 1.8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .vignette {
      z-index: 8;
      box-shadow: inset 0 0 55px #02030c99;
      background: linear-gradient(180deg, transparent 62%, #02030b30 100%);
    }

    .toggle {
      display: none;
      position: absolute;
      z-index: 12;
      right: 14px;
      bottom: 14px;
      width: 38px;
      height: 38px;
      border: 1px solid #ffffff35;
      border-radius: 50%;
      padding: 0;
      color: #fff;
      background: #080a2078;
      backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: .58;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toggle:hover,
    .toggle:focus-visible { opacity: 1; transform: scale(1.06); outline: 2px solid #bfc4ff; }
    .toggle::before { content: 'Ⅱ'; font: 700 14px/1 system-ui; }
    .stage.is-paused .toggle::before { content: '▶'; }
    .stage.is-paused * { animation-play-state: paused !important; }

    @keyframes camera-drift {
      from { transform: scale(1.01) translate3d(0, 0, 0); }
      to { transform: scale(1.025) translate3d(0, -2px, 0); }
    }
    @keyframes light-drift {
      from { background-position: 0 0; opacity: .62; }
      to { background-position: 16% 8%; opacity: 1; }
    }
    @keyframes mist-drift {
      from { transform: translate3d(-5%, 0, 0) scaleX(1.08); opacity: .1; }
      to { transform: translate3d(5%, -2px, 0) scaleX(1.16); opacity: .24; }
    }
    @keyframes shadow-breathe {
      from { transform: translateX(-50%) scaleX(.9); opacity: .54; }
      to { transform: translateX(-50%) scaleX(1.04); opacity: .72; }
    }

    @media (prefers-reduced-motion: reduce) {
      .backdrop, .night-light, .mist, .ground-shadow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Escena nocturna animada por fotogramas">
    <img class="backdrop" src="assets/night-valley-background.png" alt="Paisaje nocturno bajo la Vía Láctea">
    <span class="night-light" aria-hidden="true"></span>
    <span class="mist" aria-hidden="true"></span>
    <canvas id="atmosphere" width="360" height="640" aria-hidden="true"></canvas>
    <span class="ground-shadow" aria-hidden="true"></span>
    <span class="neko" aria-hidden="true"></span>
    <span class="vignette" aria-hidden="true"></span>
    <button class="toggle" type="button" aria-label="Pausar animación"></button>
  </main>

  <script>
    (() => {
      'use strict';

      const stage = document.querySelector('.stage');
      const neko = document.querySelector('.neko');
      const toggle = document.querySelector('.toggle');
      const canvas = document.querySelector('#atmosphere');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const frameOrder = [0, 1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1];
      const frameDuration = 320;
      let paused = false;
      let pausedAt = 0;
      let pauseStarted = 0;
      let lastSpriteFrame = -1;

      function showSpriteFrame(frame) {
        const column = frame % 4;
        const row = Math.floor(frame / 4);
        neko.style.backgroundPosition = `${column * 100 / 3}% ${row * 100}%`;
      }

      let seed = 87431;
      const random = () => ((seed = seed * 16807 % 2147483647) - 1) / 2147483646;
      const stars = Array.from({ length: 74 }, (_, i) => ({
        x: random() * canvas.width,
        y: random() * canvas.height * .62,
        size: i < 13 ? 1.1 + random() * 1.2 : .35 + random() * .8,
        phase: random() * Math.PI * 2,
        speed: .7 + random() * 1.8
      }));
      const grass = Array.from({ length: 82 }, (_, i) => ({
        x: random() * canvas.width,
        y: canvas.height * (.84 + random() * .16),
        height: 5 + random() * 13,
        width: .45 + random() * .8,
        phase: random() * Math.PI * 2,
        depth: random(),
        color: i % 4 === 0 ? '#6f83a2' : i % 3 === 0 ? '#455d80' : '#263c62'
      }));

    const flowers = Array.from({ length: 18 }, (_, index) => ({
      x: (index * 37 % 100) / 100,
      y: .79 + ((index * 19) % 18) / 100,
      height: 5 + (index % 4) * 2,
      phase: index * .83,
      color: index % 3 === 0 ? '#cab8ff' : index % 3 === 1 ? '#8d83e8' : '#b68bcf'
    }));

    const fireflies = Array.from({ length: 15 }, (_, index) => ({
      x: .08 + ((index * 29) % 84) / 100,
      y: .62 + ((index * 17) % 28) / 100,
      phase: index * 1.37,
      speed: .55 + (index % 4) * .12
    }));

    const horizonLights = Array.from({ length: 17 }, (_, index) => ({
      x: .07 + ((index * 31) % 88) / 100,
      y: .655 + ((index * 7) % 5) / 1000,
      phase: index * .72
    }));

    function drawHaze(time) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.filter = `blur(${Math.max(5, width * .016)}px)`;
      for (let i = 0; i < 4; i += 1) {
        const drift = Math.sin(time * (.07 + i * .012) + i * 1.8) * width * .018;
        const gradient = ctx.createRadialGradient(
          width * (.16 + i * .24) + drift, height * (.49 + i * .018), 0,
          width * (.16 + i * .24) + drift, height * (.49 + i * .018), width * .18
        );
        gradient.addColorStop(0, 'rgba(105, 91, 188, .035)');
        gradient.addColorStop(1, 'rgba(44, 53, 119, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, height * .36, width, height * .28);
      }
      ctx.restore();
    }

    function drawHorizonLight(light, time) {
      const pulse = .28 + Math.max(0, Math.sin(time * .7 + light.phase)) * .36;
      const x = light.x * width;
      const y = light.y * height;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = `rgba(255, 207, 137, ${pulse})`;
      ctx.shadowBlur = 5;
      ctx.shadowColor = '#ffd99a';
      ctx.fillRect(x, y, Math.max(1, width / 430), Math.max(1, width / 430));
      ctx.restore();
    }

    function drawEdgeBranches(time) {
      const sway = reduced ? 0 : Math.sin(time * .42) * width * .004;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(7, 12, 39, .7)';
      ctx.fillStyle = 'rgba(16, 27, 66, .72)';
      ctx.lineWidth = Math.max(2, width * .006);
      [-1, 1].forEach((side) => {
        const baseX = side < 0 ? -2 : width + 2;
        const tipX = side < 0 ? width * .105 + sway : width * .895 - sway;
        const baseY = height * .94;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.quadraticCurveTo(baseX + side * -width * .025, height * .80, tipX, height * .73);
        ctx.stroke();
        for (let i = 0; i < 6; i += 1) {
          const t = .24 + i * .115;
          const x = baseX + (tipX - baseX) * t;
          const y = baseY + (height * .73 - baseY) * t - Math.sin(t * Math.PI) * height * .035;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(side * (.55 + Math.sin(time * .36 + i) * .035));
          ctx.beginPath();
          ctx.ellipse(0, 0, width * .015, width * .006, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
      ctx.restore();
    }

    function drawFlower(flower, time) {
      const x = flower.x * width;
      const y = flower.y * height;
      const bend = reduced ? 0 : Math.sin(time * .65 + flower.phase) * width * .006;
      ctx.save();
      ctx.globalAlpha = .58;
      ctx.strokeStyle = '#273b73';
      ctx.lineWidth = Math.max(1, width / 520);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + bend * .35, y - flower.height * .55, x + bend, y - flower.height);
      ctx.stroke();
      ctx.translate(x + bend, y - flower.height);
      ctx.fillStyle = flower.color;
      for (let i = 0; i < 4; i += 1) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.ellipse(0, -2, 1.3, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#f5d98d';
      ctx.beginPath();
      ctx.arc(0, 0, 1.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFirefly(firefly, time) {
      const floatX = reduced ? 0 : Math.sin(time * firefly.speed + firefly.phase) * width * .012;
      const floatY = reduced ? 0 : Math.cos(time * firefly.speed * .72 + firefly.phase) * height * .008;
      const glow = .12 + Math.max(0, Math.sin(time * 1.25 + firefly.phase)) * .48;
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = glow;
      ctx.fillStyle = '#ffe49b';
      ctx.shadowBlur = 7;
      ctx.shadowColor = '#ffd879';
      ctx.beginPath();
      ctx.arc(firefly.x * width + floatX, firefly.y * height + floatY, Math.max(.75, width / 560), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStar(star, time) {
        const pulse = .2 + ((Math.sin(time * star.speed + star.phase) + 1) / 2) * .7;
        ctx.fillStyle = `rgba(225,226,255,${pulse})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
        if (star.size > 1.55 && pulse > .65) {
          ctx.fillRect(star.x - 3, star.y, 6, .6);
          ctx.fillRect(star.x, star.y - 3, .6, 6);
        }
      }

      function drawGrass(blade, time, windFrame) {
        const strength = Math.sin(windFrame * Math.PI / 4 + blade.phase) * (1.2 + blade.depth * 2.2);
        const gust = Math.sin(time * .55 + blade.phase) * .45;
        const bend = strength + gust;
        ctx.strokeStyle = blade.color;
        ctx.globalAlpha = .24 + blade.depth * .34;
        ctx.lineWidth = blade.width;
        ctx.beginPath();
        ctx.moveTo(blade.x, blade.y);
        ctx.quadraticCurveTo(
          blade.x + bend * .32,
          blade.y - blade.height * .55,
          blade.x + bend,
          blade.y - blade.height
        );
        ctx.stroke();
      }

      function drawShootingStar(time, offset, startX, startY, distance, fall) {
        const duration = 1.5;
        const cycle = (time + offset) % 6.4;
        if (cycle > duration) return;
        const p = cycle / duration;
        const alpha = Math.sin(p * Math.PI) * .95;
        const x = startX + p * distance;
        const y = startY + p * fall;
        const tailX = distance > 0 ? 62 : -62;
        const tailY = fall > 0 ? 25 : -25;
        const gradient = ctx.createLinearGradient(x - tailX, y - tailY, x, y);
        gradient.addColorStop(0, 'rgba(142,122,255,0)');
        gradient.addColorStop(.58, `rgba(195,184,255,${alpha * .42})`);
        gradient.addColorStop(1, `rgba(255,255,255,${alpha})`);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.35;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - tailX, y - tailY);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, 1.45, 0, Math.PI * 2);
        ctx.fill();
      }

      function render(ms) {
        const effectiveMs = paused ? pauseStarted - pausedAt : ms - pausedAt;
        const time = effectiveMs / 1000;
        const sequenceIndex = Math.floor(effectiveMs / frameDuration) % frameOrder.length;
        if (!reduced && !paused && sequenceIndex !== lastSpriteFrame) {
          lastSpriteFrame = sequenceIndex;
          showSpriteFrame(frameOrder[sequenceIndex]);
        }

        if (!paused) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          stars.forEach(star => drawStar(star, reduced ? 1 : time));
      drawHaze(time);
      horizonLights.forEach((light) => drawHorizonLight(light, time));
      drawEdgeBranches(time);

      const windFrame = Math.floor(effectiveMs / 320) % 8;
          grass.forEach(blade => drawGrass(blade, reduced ? 1 : time, windFrame));
      flowers.forEach((flower) => drawFlower(flower, time));
      fireflies.forEach((firefly) => drawFirefly(firefly, time));
      ctx.globalAlpha = 1;
          if (!reduced) {
            drawShootingStar(time, 0, 18, 70, 145, 58);
            drawShootingStar(time, 2.15, 232, 118, 112, 44);
            drawShootingStar(time, 4.3, 338, 48, -126, 50);
          }
        }
        requestAnimationFrame(render);
      }

      toggle.addEventListener('click', () => {
        paused = !paused;
        stage.classList.toggle('is-paused', paused);
        toggle.setAttribute('aria-label', paused ? 'Reproducir animación' : 'Pausar animación');
        if (paused) {
          pauseStarted = performance.now();
        } else {
          pausedAt += performance.now() - pauseStarted;
        }
      });

      showSpriteFrame(0);
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
